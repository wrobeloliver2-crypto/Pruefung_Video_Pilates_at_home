<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Prüfung · Pilates @home</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#2b2b28;--mute:#6f6c66;--line:#e5e0d8;--accent:#c8818c;--on:#fff;--ok:#2d5016;--warn:#a4571b;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#1d1c1a;--card:#262522;--ink:#f1eee8;--mute:#a9a49b;--line:#3a3834;--accent:#d99aa4;--on:#1d1c1a;--ok:#8fc16a;--warn:#e0a070;--err:#f2928b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
main{max-width:860px;margin:0 auto}
h1{font-size:22px;margin:8px 0 4px}h2{font-size:18px;margin:24px 0 8px}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
button,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
button.pri{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:default}
select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px}
textarea{min-height:84px}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;border:1px solid var(--line)}
.ok{color:var(--ok);border-color:var(--ok)}.aend{color:var(--warn);border-color:var(--warn)}.err{color:var(--err)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:var(--ok)}
.medien{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.platz{border:1px dashed var(--line);border-radius:10px;padding:24px 10px;text-align:center;color:var(--mute);font-size:14px}
a.li{display:block;text-decoration:none;color:inherit}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tabs button[aria-pressed=true]{background:var(--accent);color:var(--on);border-color:var(--accent)}
.scroll{overflow-x:auto}
.med{width:100%;max-height:70vh;border-radius:10px;background:#000;object-fit:contain;display:block}
img.med{background:var(--line)}audio{width:100%}
.mo{font-weight:600;border-color:transparent;color:#fff}.mo-Matte{background:#5b7f95}.mo-Stand{background:#7a8f4e}.mo-Reformer{background:#a8667a}
.probe .zl{font-size:28px;font-weight:700;margin:6px 0}.probe .zl small{font-size:14px;font-weight:400;color:var(--mute)}
.pl{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.pl button[aria-pressed=true]{background:var(--accent);color:var(--on);border-color:var(--accent)}
</style>
</head>
<body>
<main id="app"><p class="mute">Lade …</p></main>
<script>
const API='/api';let TOKEN='';let ME=null;
try{const m=location.hash.match(/ma=([^&]+)/);if(m){TOKEN=decodeURIComponent(m[1]);sessionStorage.setItem('pp_t',TOKEN);history.replaceState(null,'',location.pathname)}else TOKEN=sessionStorage.getItem('pp_t')||''}catch(e){}
const $=s=>document.querySelector(s);const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function call(action,data){
  try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,data,token:TOKEN})});
    const j=await r.json().catch(()=>({error:'antwort'}));return {status:r.status,...j}}
  catch(e){return {status:0,error:'netz'}}
}
const MODUS={Matte:'Matte',Stand:'Stehend',Reformer:'Reformer'};
const mtag=m=>m?`<span class="tag mo mo-${esc(m)}">${esc(MODUS[m]||m)}</span>`:'';
const ART={bild_start:'Bild Start',bild_ende:'Bild Ende',video:'Video',voice:'Voice',zaehlen:'Zählen'};
function fehlerSeite(txt){app.innerHTML=`<h1>Prüfung</h1><div class="card"><p>${esc(txt)}</p><p class="mute">Bitte über die Kachel „Prüfung“ im Portal öffnen. Der Fehler wurde gemeldet.</p></div>`}
async function start(){
  if(!TOKEN){await call('fehlerMelden',{art:'kein_zugang',details:'ohne Portal-Anmeldung geöffnet'});return fehlerSeite('Kein Zugang.')}
  const me=await call('me');
  if(me.status===401){return fehlerSeite('Kein Zugang oder Anmeldung abgelaufen.')}
  if(me.error){return fehlerSeite('Der Dienst antwortet gerade nicht.')}
  ME=me;ME.rolle==='admin'?admin():liste();
}
// ───────── Prüferin ─────────
async function liste(){
  const r=await call('liste');if(r.error)return fehlerSeite('Die Liste lässt sich nicht laden.');
  const u=r.uebungen;const fertig=u.filter(x=>x.ok===5).length;
  app.innerHTML=`<h1>Hallo ${esc(ME.name)}</h1><p class="mute">${fertig} von ${u.length} Übungen vollständig freigegeben</p>
  <div class="bar"><i style="width:${u.length?100*fertig/u.length:0}%"></i></div>
  ${u.length?'':'<div class="card">Noch nichts zur Prüfung zugewiesen.</div>'}
  ${u.map(x=>`<a class="li card" href="#u/${esc(x.id)}"><div class="row"><div class="grow"><b>${esc(x.name)}</b><div class="row" style="gap:6px;margin-top:2px">${mtag(x.modus)}<span class="mute">${esc(x.phase||'')}</span></div></div>
   <span class="tag ok">${x.ok}/5 OK</span>${x.aenderung?`<span class="tag aend">${x.aenderung} Änderung</span>`:''}</div></a>`).join('')}`;
}
const LBL_PP='▶ Abspielen (vor und zurück)',LBL_LOOP='▶ Abspielen (Rücklauf ist im Video enthalten)';
function medium(a,i){
  if(a==='zaehlen'){const t=window.TKC;return t&&t.sek?`<p>Prüfe im Probelauf oben: Zählt die Stimme im richtigen Moment mit, stimmt die Anzahl, und passt das Tempo der Bewegung zum Takt? Vorgabe: <b>${t.text}</b>, ${String(t.sek).replace('.',',')} Sekunden je Wiederholung.</p>`:`<p>Für diese Übung gibt es keinen Zähltakt${t?' ('+esc(t.text)+')':''}. Prüfe im Probelauf, ob Dauer und Ablauf zur Bewegung passen.</p>`}
  if(!i.im_speicher)return'<div class="platz">Medium ist noch nicht im Prüfspeicher</div>';
  if(!i.url)return'<div class="platz">Medium lässt sich gerade nicht laden</div>';
  const u=esc(i.url);
  if(a==='bild_start'||a==='bild_ende')return`<img class="med" src="${u}" alt="${ART[a]}">`;
  if(a==='voice')return`<audio controls preload="none" src="${u}"></audio>`;
  return`<video class="med" muted playsinline preload="auto" ${i.video_mit_rueck?'loop':''} src="${u}"></video>
   <div class="pl"><button class="pp-play">${i.video_mit_rueck?LBL_LOOP:LBL_PP}</button><button class="pp-sp" data-s="1" aria-pressed="true">1×</button><button class="pp-sp" data-s="0.5" aria-pressed="false">0,5×</button></div>`;
}
function pingpong(card){
  const v=card.querySelector('video');if(!v)return;
  const play=card.querySelector('.pp-play');let speed=1,state='stop',last=0;
  const stop=()=>{state='stop';v.pause();play.textContent=v.loop?LBL_LOOP:LBL_PP};
  const vor=()=>{state='vor';v.playbackRate=speed;v.play().catch(()=>stop())};
  v.addEventListener('ended',()=>{if(state!=='vor')return;state='rueck';v.pause();last=performance.now();requestAnimationFrame(tick)});
  function tick(now){
    if(state!=='rueck')return;
    const dt=(now-last)/1000;last=now;
    v.currentTime=Math.max(0,v.currentTime-dt*speed);
    if(v.currentTime<=0.02){v.currentTime=0;vor();return}
    requestAnimationFrame(tick);
  }
  play.onclick=()=>{if(state==='stop'){v.currentTime=0;play.textContent='■ Stopp';vor()}else stop()};
  card.querySelectorAll('.pp-sp').forEach(b=>b.onclick=()=>{speed=Number(b.dataset.s);v.playbackRate=speed;card.querySelectorAll('.pp-sp').forEach(x=>x.setAttribute('aria-pressed',x===b))});
}
// ───────── Probelauf: Voice, Video und Zählen zusammen, wie in der App ─────────
let TAKT=null,PROBE_STOP=null;
const takt=async id=>{if(!TAKT){try{TAKT=await (await fetch('/takt.json')).json()}catch(e){TAKT={}}}return TAKT[id]||null};
function probeKarte(by,t){
  if(!by.video||!by.voice||!by.video.url)return'';
  const z=t&&t.sek;
  return`<div class="card probe"><b>Probelauf: Voice, Video und Zählen zusammen</b>
   <p class="mute">So läuft es in der App: erst die Stimme (Ansage, Info, Hinweis, Startposition), dann Bewegung und Zählen im festen Takt. Prüfe: Passt die Stimme zur Übung? Stimmt die Anzahl? Passt jede Zahl zur Bewegung?</p>
   <video class="med" id="pv" muted playsinline preload="auto" src="${esc(by.video.url)}"></video>
   <div class="zl" id="pz">&nbsp;</div><div class="mute" id="pi"></div>
   <div class="pl"><button class="pri" id="pgo">▶ Probelauf starten</button><button id="pskip">Voice überspringen</button></div>
   <div style="margin-top:10px"><label>Tempo der Bewegung: <b id="ptv">1,00×</b> <span class="mute">(langsamer ← → schneller)</span></label>
    <input type="range" id="pt" min="0.5" max="1.5" step="0.05" value="1" style="width:100%">
    ${z?`<button id="pfit" style="margin-top:6px">Tempo an den Zähltakt anpassen</button>`:''}</div>
   ${z?`<div class="row" style="margin-top:10px"><label>Wiederholungen <input type="number" id="pr" min="1" max="30" value="${t.reps}" style="width:80px"></label>
    <label>Sekunden je Wiederholung <input type="number" id="ps" min="2" max="30" step="0.5" value="${String(t.sek)}" style="width:80px"></label>
    <span class="mute">Standard: ${t.reps} × ${String(t.sek).replace('.',',')} s</span></div>
   <button id="pnote" style="margin-top:8px">Diese Werte als Änderungswunsch bei „Zählen“ eintragen</button>`:''}</div>`;
}
async function probe(id,by,t){
  const go=$('#pgo');if(!go)return;
  const v=$('#pv'),z=$('#pz'),inf=$('#pi'),tr=$('#pt'),tv=$('#ptv');
  const rueck=!!by.video.video_mit_rueck;
  const rate=()=>Number(tr.value);
  const zyk=()=>v.duration?(rueck?v.duration:2*v.duration):0;
  const sek=()=>t&&t.sek?Number($('#ps').value)||t.sek:0;
  const reps=()=>t&&t.sek?Number($('#pr').value)||t.reps:0;
  const info=()=>{const c=zyk()/rate();
    inf.textContent=t&&t.sek?`${t.text} · Zähltakt ${String(sek()).replace('.',',')} s`+(c?` · ein Hin und Zurück dauert bei diesem Tempo ${c.toFixed(1).replace('.',',')} s`:''):(t?`${t.text} · kein Zähltakt (fester Ablauf)`:'')};
  const setRate=()=>{tv.textContent=rate().toFixed(2).replace('.',',')+'×';v.playbackRate=rate();info()};
  v.addEventListener('loadedmetadata',info);
  tr.oninput=setRate;setRate();
  const pf=$('#pfit');if(pf)pf.onclick=()=>{const q=zyk()/sek();tr.value=Math.min(1.5,Math.max(0.5,Math.round(q*20)/20));setRate()};
  ['#pr','#ps'].forEach(q=>{const e=$(q);if(e)e.oninput=info});
  const pn=$('#pnote');if(pn)pn.onclick=()=>{
    const c=app.querySelector('.card[data-art="zaehlen"]');const tx=c&&c.querySelector('textarea');
    if(tx){tx.value=`Takt: ${reps()} Wiederholungen, ${String(sek()).replace('.',',')} Sekunden je Wiederholung; Bewegung im Tempo ${rate().toFixed(2).replace('.',',')}×.`;tx.scrollIntoView({block:'center'});tx.focus()}};
  let st=null,ZA=null;
  if(window.ZA_URL){ZA={};for(const k in window.ZA_URL){const a=new Audio(window.ZA_URL[k]);a.preload='auto';ZA[k]=a}}
  const stop=()=>{if(st){st.timers.forEach(clearTimeout);st.auds.forEach(a=>{try{a.pause()}catch(e){}})}st=null;v.pause();v.loop=false;v.onended=null;go.textContent='▶ Probelauf starten';z.innerHTML='&nbsp;'};
  PROBE_STOP=stop;
  const spiele=key=>{const a=ZA&&ZA[key];if(!a)return;try{a.currentTime=0;a.play().catch(()=>{})}catch(e){}};
  const bewegung=()=>{
    v.currentTime=0;v.playbackRate=rate();
    if(rueck){v.loop=true;v.play().catch(()=>{});return}
    let mode='vor',last=0;
    const vor=()=>{mode='vor';v.playbackRate=rate();v.play().catch(()=>{})};
    v.onended=()=>{if(!st||mode!=='vor')return;mode='rueck';v.pause();last=performance.now();requestAnimationFrame(tick)};
    const tick=n=>{if(!st||mode!=='rueck')return;const dt=(n-last)/1000;last=n;v.currentTime=Math.max(0,v.currentTime-dt*rate());if(v.currentTime<=0.02){v.currentTime=0;vor();return}requestAnimationFrame(tick)};
    vor();
  };
  const zaehlen=s=>{
    bewegung();
    if(!t||!t.sek){z.textContent='Kein Zähltakt – Video läuft';return}
    const R=reps(),S=sek(),n=t.seiten;let zeit=0;
    for(let sd=1;sd<=n;sd++){
      if(n>1){s.timers.push(setTimeout(()=>{if(st===s)spiele('s'+sd)},zeit*1000));zeit+=2.2}
      for(let k=1;k<=R;k++){const kz=zeit;
        s.timers.push(setTimeout(()=>{if(st!==s)return;z.innerHTML=`${k} <small>von ${R}${n>1?' · Seite '+sd+' von 2':''}</small>`;spiele(String(k))},kz*1000));
        zeit+=S}
    }
    s.timers.push(setTimeout(()=>{if(st===s)stop()},(zeit+1)*1000));
  };
  const start=mitVoice=>{
    stop();const s=st={timers:[],auds:[]};go.textContent='■ Stopp';
    const vo=by.voice.url;
    if(mitVoice&&vo){z.textContent='Stimme läuft …';const a=new Audio(vo);s.auds.push(a);a.onended=()=>{if(st===s)zaehlen(s)};a.onerror=()=>{if(st===s)zaehlen(s)};a.play().catch(()=>zaehlen(s))}
    else zaehlen(s);
  };
  go.onclick=()=>{st?stop():start(true)};
  $('#pskip').onclick=()=>start(false);
}
async function uebung(id){
  const r=await call('uebung',{id});if(r.error)return fehlerSeite('Die Übung lässt sich nicht laden.');
  const order=['bild_start','bild_ende','video','voice','zaehlen'];
  const by=Object.fromEntries(r.inhalte.map(i=>[i.art,i]));
  const TK=await takt(r.uebung.id);window.ZA_URL=r.zaehl||null;window.TKC=TK;
  app.innerHTML=`<p><a href="#" id="zur">← Übersicht</a></p><h1>${esc(r.uebung.name)}</h1><p class="row" style="gap:6px">${mtag(r.uebung.modus)}<span class="mute">${esc(r.uebung.phase||'')}</span></p>
  ${probeKarte(by,TK)}
  ${order.map(a=>{const i=by[a];if(!i)return`<div class="card"><b>${ART[a]}</b><div class="platz">fehlt noch</div></div>`;
   return`<div class="card" data-id="${i.id}" data-art="${a}"><div class="row"><b class="grow">${ART[a]} <span class="mute">v${i.version}</span></b>
    ${i.entscheidung==='ok'?'<span class="tag ok">OK · gesperrt</span>':i.entscheidung==='aenderung'?'<span class="tag aend">Änderung gewünscht</span>':''}</div>
    ${i.hinweis?`<p class="mute">Bekannter Hinweis: ${esc(i.hinweis)}</p>`:''}
    ${a==='video'?(i.video_mit_rueck?'<p class="mute">Dieses Video enthält den Rücklauf schon (Hinweg und Rückweg in einer Datei). Es wird als Ganzes geprüft; die Entscheidung gilt für beides.</p>':'<p class="mute">Das Video wird als Ganzes geprüft: Hinweg und Rückwärtslauf zusammen, so wie es im Programm läuft. Die Entscheidung gilt für beides.</p>'):''}
    ${medium(a,i)}
    ${(i.gesperrt||ME.rolle==='admin')?'':`<div class="row" style="margin-top:10px"><button class="pri ok-btn">OK</button><span class="mute">oder Änderung beschreiben:</span></div>
     <textarea placeholder="Was soll geändert werden?">${esc(i.entscheidung==='aenderung'?i.kommentar:'')}</textarea>
     <button class="aend-btn" style="margin-top:8px">Änderung senden</button><span class="err msg"></span>`}</div>`}).join('')}`;
  $('#zur').onclick=e=>{e.preventDefault();location.hash=''};
  probe(r.uebung.id,by,TK);
  app.querySelectorAll('.card[data-id]').forEach(c=>{
    const id=Number(c.dataset.id);const msg=c.querySelector('.msg');
    const senden=async(ent,txt)=>{const x=await call('entscheiden',{assetId:id,entscheidung:ent,kommentar:txt});
      if(x.error){msg.textContent=x.error==='text_noetig'?' Bitte Text eingeben.':' Speichern nicht möglich.';if(x.error!=='text_noetig')call('fehlerMelden',{art:'speicher_fehler',details:'entscheiden '+x.error});return}
      route()};
    pingpong(c);
    const ok=c.querySelector('.ok-btn');if(ok)ok.onclick=()=>senden('ok');
    const ae=c.querySelector('.aend-btn');if(ae)ae.onclick=()=>senden('aenderung',c.querySelector('textarea').value);
  });
}
// ───────── Admin ─────────
let TAB='fortschritt';let FILTER='alle';let BULK='';const SEL=new Set();
async function admin(){
  const r=await call('adminUebersicht');if(r.error)return fehlerSeite('Die Übersicht lässt sich nicht laden.');
  const u=r.uebungen;const voll=u.filter(x=>x.pruefbar);
  const je=r.pruefer.map(p=>{const z=u.filter(x=>x.reviewer_id===p.id);return{name:p.name,zug:z.length,fertig:z.filter(x=>x.ok===5).length,aend:z.filter(x=>x.aenderung>0).length}});
  const tabs=[['fortschritt','Fortschritt'],['zuweisen','Aufträge'],['aenderung',`Änderungen (${r.aenderungen.length})`],['fehler',`Fehler (${r.fehler.length})`]];
  let body='';
  if(TAB==='fortschritt'){
    const prod=u.filter(x=>x.video_da&&x.voice_da);const bereit=prod.filter(x=>!x.pruefbar);const offen=u.filter(x=>!(x.video_da&&x.voice_da));
    const chips=x=>`<span class="tag ok">✓ Bild Start</span><span class="tag ok">✓ Bild Ende</span>`+(x.video_da?`<span class="tag ok">✓ Video</span>`:`<span class="tag err">✗ Video</span>`)+(x.voice_da?`<span class="tag ok">✓ Voice</span>`:`<span class="tag err">✗ Voice</span>`);
    const karte=x=>`<div class="card"><div class="row"><b class="grow">${esc(x.name)}</b>${mtag(x.modus)}</div><div class="row" style="margin-top:6px">${chips(x)}</div><div class="mute" style="margin-top:6px">Video: ${esc(x.video_status||'–')} · Voice: ${esc(x.voice_status||'–')}</div></div>`;
    body=`<div class="card"><b>Gesamt (${u.length} Übungen)</b>
     <div class="mute">${prod.length} fertig produziert (Bild, Video und Voice) · ${voll.length} davon im Prüfspeicher und prüfbar · ${u.filter(x=>x.ok===5).length} freigegeben</div>
     <div class="bar" style="margin-top:8px"><i style="width:${u.length?100*prod.length/u.length:0}%"></i></div>
     ${['Matte','Stand','Reformer'].map(m=>{const g=u.filter(x=>x.modus===m);return g.length?`<div class="row" style="margin-top:8px">${mtag(m)}<span class="mute">${g.length} Übungen · ${g.filter(x=>x.video_da&&x.voice_da).length} fertig produziert · ${g.filter(x=>x.pruefbar).length} im Prüfspeicher · ${g.filter(x=>x.ok===5).length} freigegeben</span></div>`:''}).join('')}</div>
     ${je.map(p=>`<div class="card"><div class="row"><b class="grow">${esc(p.name)}</b><span class="mute">${p.fertig}/${p.zug} geprüft · ${p.aend} mit Änderung</span></div><div class="bar"><i style="width:${p.zug?100*p.fertig/p.zug:0}%"></i></div></div>`).join('')}
     <h2>Fertig produziert, noch nicht im Prüfspeicher (${bereit.length})</h2><p class="mute">Diese Übungen müssen nur noch in den Prüfspeicher hochgeladen werden.</p>${bereit.map(karte).join('')||'<p class="mute">Keine.</p>'}
     <h2>Produktion noch offen (${offen.length})</h2><p class="mute">Grün = vorhanden, rot = fehlt noch. Stand laut Bestandsliste.</p>${offen.map(karte).join('')||'<p class="mute">Keine.</p>'}`;}
  if(TAB==='zuweisen'){
    const sicht=voll.filter(x=>FILTER==='alle'||x.modus===FILTER);
    const anz=m=>m==='alle'?voll.length:voll.filter(x=>x.modus===m).length;
    const alleSel=sicht.length&&sicht.every(x=>SEL.has(x.id));
    body=`<p class="mute">Hier stehen nur Übungen, die prüfbar sind (Bild Start, Bild Ende, Video und Voice vorhanden).</p>
    <div class="tabs">${[['alle','Alle'],['Matte','Matte'],['Stand','Stehend'],['Reformer','Reformer']].map(([k,l])=>`<button data-fl="${k}" aria-pressed="${FILTER===k}">${l} (${anz(k)})</button>`).join('')}</div>
    <div class="card row" style="position:sticky;top:0;z-index:2">
      <label class="row" style="gap:6px"><input type="checkbox" id="selall" ${alleSel?'checked':''}> Alle ${sicht.length} sichtbaren</label>
      <span class="mute grow">${SEL.size} ausgewählt</span>
      <select id="bulk" style="width:auto"><option value="">Zuweisen an …</option>${r.pruefer.map(p=>`<option value="${p.id}" ${BULK===String(p.id)?'selected':''}>${esc(p.name)}</option>`).join('')}<option value="0" ${BULK==='0'?'selected':''}>Zuweisung aufheben</option></select>
      <button class="pri" id="bulkgo" ${SEL.size&&BULK!==''?'':'disabled'}>Auf ${SEL.size} anwenden</button></div>`
    +(sicht.length?'':'<p class="mute">Keine Übung in dieser Auswahl.</p>')+sicht.map(x=>`<div class="card"><div class="row"><input type="checkbox" data-sel="${esc(x.id)}" ${SEL.has(x.id)?'checked':''} style="width:22px;height:22px">${x.vorschau?`<a href="#u/${esc(x.id)}"><img src="${esc(x.vorschau)}" loading="lazy" alt="Startposition ${esc(x.name)}" style="width:64px;height:64px;object-fit:cover;border-radius:8px;display:block"></a>`:'<div style="width:64px;height:64px;border-radius:8px;background:#0001"></div>'}<div class="grow"><b>${esc(x.name)}</b> ${mtag(x.modus)} <span class="mute"> · <a href="#u/${esc(x.id)}">ansehen</a></span></div>
    <select data-e="${esc(x.id)}" style="width:auto"><option value="0">nicht zugewiesen</option>${r.pruefer.map(p=>`<option value="${p.id}" ${x.reviewer_id===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div></div>`).join('');
  }
  if(TAB==='aenderung')body=r.aenderungen.map(a=>`<div class="card"><b>${esc(a.uebung)}</b> · ${ART[a.art]||esc(a.art)} v${a.version}<div>${esc(a.kommentar)}</div><div class="mute">${esc(a.pruefer)} · ${new Date(a.zeitstempel).toLocaleString('de-DE')}</div></div>`).join('')||'<p class="mute">Keine offenen Änderungswünsche.</p>';
  if(TAB==='fehler')body=r.fehler.map(f=>`<div class="card"><div class="row"><b class="grow">${esc(f.art)}</b><button data-f="${f.id}">erledigt</button></div><div class="mute">${new Date(f.zeitpunkt).toLocaleString('de-DE')} ${esc(f.exercise_id||'')}</div><div>${esc(f.details||'')}</div></div>`).join('')||'<p class="mute">Keine offenen Fehler.</p>';
  app.innerHTML=`<h1>Prüfung · Admin</h1><div class="tabs">${tabs.map(([k,l])=>`<button data-t="${k}" aria-pressed="${TAB===k}">${l}</button>`).join('')}</div>${body}`;
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;admin()});
  app.querySelectorAll('[data-fl]').forEach(b=>b.onclick=()=>{FILTER=b.dataset.fl;admin()});
  app.querySelectorAll('input[data-sel]').forEach(c=>c.onchange=()=>{c.checked?SEL.add(c.dataset.sel):SEL.delete(c.dataset.sel);admin()});
  const sa=$('#selall');if(sa)sa.onchange=()=>{voll.filter(x=>FILTER==='alle'||x.modus===FILTER).forEach(x=>sa.checked?SEL.add(x.id):SEL.delete(x.id));admin()};
  const bk=$('#bulk');if(bk)bk.onchange=()=>{BULK=bk.value;admin()};
  const go=$('#bulkgo');if(go)go.onclick=async()=>{go.disabled=true;go.textContent='Speichere …';for(const id of [...SEL]){await call('zuweisen',{exerciseId:id,reviewerId:Number(BULK)})}SEL.clear();BULK='';admin()};
  app.querySelectorAll('select[data-e]').forEach(s=>s.onchange=async()=>{await call('zuweisen',{exerciseId:s.dataset.e,reviewerId:Number(s.value)});admin()});
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=async()=>{await call('fehlerErledigt',{id:Number(b.dataset.f)});admin()});
}
function route(){if(!ME)return;if(PROBE_STOP)try{PROBE_STOP()}catch(e){}PROBE_STOP=null;const m=location.hash.match(/^#u\/(.+)$/);if(ME.rolle==='admin')return m?uebung(decodeURIComponent(m[1])):admin();m?uebung(decodeURIComponent(m[1])):liste()}
window.addEventListener('hashchange',route);
setInterval(()=>{if(ME&&ME.rolle==='admin'&&document.visibilityState==='visible'&&!location.hash.startsWith('#u/')&&!(TAB==='zuweisen'&&SEL.size))admin()},30000);
start();
</script>
</body>
</html>
